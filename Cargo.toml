[package]
name = "flatpak-manager"
version = "0.1.0"
description = "Créer, installer et désinstaller des Flatpak sans terminal"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bzip2 = "0.6.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
eframe = "0.37.0"
egui = "0.37.0"
flate2 = "1.1.10"
goblin = { version = "0.10.7", default-features = false, features = ["elf32", "elf64", "endian_fd", "std"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
rfd = "0.17.2"
ruzstd = "0.9.1"
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }
tar = "0.4.46"
toml = "1.1.8"
xz2 = "0.1.7"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
opt-level = 3
