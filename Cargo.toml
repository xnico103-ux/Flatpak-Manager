[package]
name = "flatpak-manager"
version = "0.1.0"
description = "Créer, installer et désinstaller des Flatpak sans terminal"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bzip2 = "0.6.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "default_fonts", "links", "system_fonts", "wayland", "wgpu"] }
egui = "0.37.0"
flate2 = "1.1.10"
goblin = { version = "0.10.7", default-features = false, features = ["elf32", "elf64", "endian_fd", "std"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
rfd = "0.17.2"
ruzstd = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }
tar = "0.4.46"
toml = "1.1.8"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen"] }
xz2 = "0.1.7"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
opt-level = 3
